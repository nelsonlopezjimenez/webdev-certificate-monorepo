<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe - STEP 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1rem;
        }
        
        #status {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            min-height: 30px;
            font-weight: bold;
            color: #667eea;
        }
        
        #board {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
            gap: 10px;
            margin-bottom: 1rem;
        }
        
        .cell {
            background: #f0f0f0;
            border: 3px solid #ddd;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .cell:hover:not(.filled) {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        
        .cell.filled {
            cursor: not-allowed;
        }
        
        .cell img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
        
        .cell.winner {
            background: #ffd700;
            animation: winner-pulse 0.5s ease-in-out infinite alternate;
        }
        
        @keyframes winner-pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        
        button {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic-Tac-Toe</h1>
        <div id="status">Your turn! Click a square</div>
        <div id="board">
            <!-- We'll create cells with JavaScript -->
        </div>
        <button id="resetButton">Reset Game</button>
    </div>
    
    <script src="tictactoe.js"></script>
</body>
</html>
